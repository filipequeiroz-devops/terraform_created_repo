apiVersion: v1
kind: Pod
metadata:
  name: endpoint-slice-nginx-pod #10.2.2.67 
  labels:
    env: prod
spec:
  containers:
    - name: endpoint-slices-container
      image: nginx:latest
---
apiVersion: v1
kind: Pod
metadata:
  name: endpoint-slices-apache-pod #10.2.2.208
  labels:
    env: prod
spec:
  containers:
    - name: endpoint-slices-container
      image: httpd:latest

---

apiVersion: v1
kind: Service
metadata:
  name: filipes-svc-enddpointslice 
spec:
  ports:
    - name: http
      port: 80

---
#NGINX slice
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: filipes-endpointslice #The name doesn't need to be the as the service anymore
  labels:
    kubernetes.io/service-name: filipes-svc-enddpointslice #Here's the important part, this label is what associates the endpoint slice with the service now
addressType: IPv4
endpoints:
  - addresses:
      - 10.2.2.67    #NGINX
     #- ip:    #APACHE
ports:
  - name: http #Also important, the port name must match the service port name for proper association
    protocol: TCP
    port: 80

---
#APACHE slice
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: filipes-endpointslice-2
  labels:
    kubernetes.io/service-name: filipes-svc-enddpointslice 
addressType: IPv4
endpoints:
  - addresses:
      - 10.2.2.208    #APACHE
ports:
  - name: http 
    protocol: TCP
    port: 80