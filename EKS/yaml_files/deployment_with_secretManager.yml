apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment

spec:
  

  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      serviceAccountName: secrets-sa
      containers:
        - name: nginx-container
          image: nginx:latest

          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true

          ports:
            - containerPort: 80

      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: aws-secrets